name: Affiliate programme CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/affiliate-program-rebuild

permissions:
  contents: read

concurrency:
  group: affiliate-program-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Affiliate and referral lint
        run: npm run lint:affiliate
      - name: Production build
        run: npm run build:ci
