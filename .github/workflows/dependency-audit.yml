name: Dependency security audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies and generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Run npm security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            console.log("Vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                via: item.via.map(v => typeof v === "string" ? v : {
                  name: v.name, title: v.title, url: v.url, range: v.range
                })
              }));
            }
          '
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
