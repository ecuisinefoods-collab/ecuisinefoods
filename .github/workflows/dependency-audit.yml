name: Dependency security audit

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/dependency-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve dependencies and generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Apply safe, non-major dependency fixes
        run: npm audit fix --ignore-scripts || echo "Some findings require further review; continuing."
      - name: Run npm security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
            const totals = report.metadata?.vulnerabilities ?? {};
            const lines = [
              "# Dependency security audit",
              "",
              "Generated automatically by GitHub Actions.",
              "",
              "| Severity | Count |",
              "|---|---:|",
              ...["critical","high","moderate","low","info"].map(k => `| ${k} | ${totals[k] ?? 0} |`),
              "",
              "| Package | Severity | Direct? | Affected range | Fix available? | Advisory |",
              "|---|---|---:|---|---|---|"
            ];
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = item.via.map(v => typeof v === "string" ? v : `${v.title} (${v.url})`).join("; ");
              lines.push(`| ${name} | ${item.severity} | ${item.isDirect ? "Yes" : "No"} | ${item.range} | ${JSON.stringify(item.fixAvailable)} | ${advisories.replaceAll("|","\\|")} |`);
            }
            const summary = lines.join("\\n") + "\\n";
            fs.writeFileSync("security-audit-summary.md", summary);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            console.log(summary);
          '
      - name: Commit lockfile and audit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json security-audit-summary.md
          if git diff --cached --quiet; then
            echo "No dependency or audit report changes to commit."
          else
            git commit -m "Apply safe dependency updates and publish audit"
            git pull --rebase origin main
            git push
          fi
      - name: Upload full audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
